server:
  port: 8000

spring:
  application:
    name: resumesearch
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RESUME_DB_NAME:resume_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

resumesearch:
  mock-llm: ${MOCK_LLM:false}
  openai:
    api-key: ${OPENAI_API_KEY:}
    # Leave blank for the public OpenAI API, or set to an Azure OpenAI resource's endpoint
    # (e.g. https://<resource>.openai.azure.com/openai/v1/). On Azure, model/query-model
    # below must be the *deployment name*, not the public model name.
    base-url: ${OPENAI_BASE_URL:}
    model: ${OPENAI_MODEL:gpt-4.1}
    query-model: ${OPENAI_QUERY_MODEL:gpt-4.1}

logging:
  level:
    org.isha.resumesearch: INFO
